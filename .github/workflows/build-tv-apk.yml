name: Build Veliora TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tv-apk.yml'
      - 'android/**'
      - 'css/**'
      - 'js/**'
      - 'libs/**'
      - 'image/**'
      - 'index.html'
      - 'player.html'
      - 'mobile-config.html'

permissions:
  contents: read

jobs:
  build-android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Copy web UI into Android app and initialize local password state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          dest = root / 'android/app/src/main/assets'
          dest.mkdir(parents=True, exist_ok=True)
          import shutil
          for name in ('css', 'js', 'libs', 'image'):
              target = dest / name
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(root / name, target)
          token = hashlib.sha256(b'veliora-apk-internal').hexdigest()
          preseed = ("try{localStorage.setItem('passwordVerified',"
                     "JSON.stringify({verified:true,timestamp:Date.now(),"
                     "passwordHash:'" + token + "'}));}catch(e){}")
          for name in ('index.html', 'player.html'):
              content = (root / name).read_text(encoding='utf-8')
              marker = '"{{PASSWORD}}";'
              if marker not in content:
                  raise RuntimeError(f'{name}: expected password marker missing')
              content = content.replace(marker, '"' + token + '"; ' + preseed, 1)
              (dest / name).write_text(content, encoding='utf-8')
          shutil.copy2(root / 'mobile-config.html', dest / 'mobile-config.html')
          print('Synced the Chinese TV interface assets and local mobile configuration page.')
          PY

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/Veliora-TV-1.0.2.apk
          test -s output/Veliora-TV-1.0.2.apk
          cd output
          sha256sum Veliora-TV-1.0.2.apk > SHA256.txt
          ls -lh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Veliora-TV-APK
          path: output/
          retention-days: 30
          if-no-files-found: error
